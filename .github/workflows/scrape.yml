name: Scrape and test

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest

  scrape:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python run_books.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python run_quotes.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t book-api .
      - run: docker build -f frontend/Dockerfile -t book-web ./frontend
      - run: docker build -f Dockerfile.scraper -t book-scraper .
