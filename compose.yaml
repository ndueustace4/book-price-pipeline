services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    command: ["python", "run_books.py"]
    env_file: .env
    profiles:
      - scrape
